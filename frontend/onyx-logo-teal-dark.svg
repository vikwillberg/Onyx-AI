<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 116" width="580" height="116">
  <defs>
    <radialGradient id="orbBaseD" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#5EFAE8"/>
      <stop offset="28%" stop-color="#0DB8A4"/>
      <stop offset="60%" stop-color="#067A6A"/>
      <stop offset="85%" stop-color="#024F41"/>
      <stop offset="100%" stop-color="#012E27"/>
    </radialGradient>
    <radialGradient id="orbShineD" cx="28%" cy="22%" r="38%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.72)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="orbRimD" cx="75%" cy="78%" r="45%">
      <stop offset="0%" stop-color="rgba(13,184,164,0.55)"/>
      <stop offset="100%" stop-color="rgba(13,184,164,0)"/>
    </radialGradient>
    <radialGradient id="shadowGradD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.30)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <linearGradient id="aiGradD" x1="0%" y1="0%" x2="90%" y2="110%">
      <stop offset="0%" stop-color="#0ECFB8"/>
      <stop offset="55%" stop-color="#0DB8A4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="softGlowD" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#0DB8A4" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="orbClipD"><circle cx="54" cy="54" r="52"/></clipPath>
  </defs>

  <ellipse cx="58" cy="112" rx="42" ry="7" fill="url(#shadowGradD)"/>

  <g transform="translate(6,6)">
    <circle cx="54" cy="54" r="52" fill="url(#orbBaseD)"/>
    <g clip-path="url(#orbClipD)" opacity="0.75">
      <path d="M -5 38 C 20 18, 55 14, 85 35 C 70 50, 38 52, 20 44 Z"
            fill="none" stroke="rgba(94,250,232,0.50)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 5 55 C 30 38, 68 40, 100 60 C 78 78, 40 72, 15 65 Z"
            fill="none" stroke="rgba(13,184,164,0.40)" stroke-width="2" stroke-linecap="round"/>
      <path d="M 10 72 C 35 58, 72 62, 105 78"
            fill="none" stroke="rgba(6,122,106,0.55)" stroke-width="3" stroke-linecap="round"/>
      <path d="M -2 22 C 25 8, 62 12, 90 28"
            fill="none" stroke="rgba(94,250,232,0.30)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 0 48 C 28 35, 65 36, 108 52 C 85 62, 45 58, 10 55 Z"
            fill="rgba(1,46,39,0.35)"/>
    </g>
    <circle cx="54" cy="54" r="52" fill="url(#orbRimD)"/>
    <circle cx="54" cy="54" r="52" fill="url(#orbShineD)"/>
    <ellipse cx="36" cy="28" rx="10" ry="7"
             fill="rgba(255,255,255,0.55)" opacity="0.9"
             transform="rotate(-20,36,28)"/>
  </g>

  <!-- NYX text — white for dark mode -->
  <text x="132" y="88"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900" font-size="78" letter-spacing="-2"
        fill="#F0F4F8">NYX</text>

  <!-- AI text — same teal gradient -->
  <text x="394" y="88"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-weight="900" font-size="78" letter-spacing="-2"
        fill="url(#aiGradD)" filter="url(#softGlowD)">AI</text>
</svg>
